# API gateway on the EC2 server
server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    # Use Docker's internal DNS and re-check container addresses every 10s.
    # Without this, nginx keeps the IPs it saw at startup, so recreating the
    # backend containers (e.g. after a deploy) would give 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_upstream http://auth-service:8000;
    set $task_upstream http://task-service:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/auth/ {
        proxy_pass $auth_upstream;
    }

    location /api/tasks {
        proxy_pass $task_upstream;
    }

    # Simple check that the gateway itself is up
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Anything else is not served by the backend
    location / {
        return 404;
    }
}
