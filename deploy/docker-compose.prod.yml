# Production stack for the EC2 server.
# Databases are NOT here: both services use Amazon RDS.
# The frontend is NOT here: it's served from S3 + CloudFront.
#
# Run on the server (from the deploy/ folder):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Secrets come from deploy/.env on the server (never committed to Git).

services:
  auth-service:
    build: ../auth-service
    environment:
      DATABASE_URL: postgresql+psycopg://auth_user:${AUTH_DB_PASSWORD}@${DB_HOST}:5432/auth_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: 60
      CORS_ORIGINS: ${CORS_ORIGINS}
    restart: unless-stopped

  task-service:
    build: ../task-service
    environment:
      DATABASE_URL: jdbc:postgresql://${DB_HOST}:5432/task_db
      DATABASE_USERNAME: task_user
      DATABASE_PASSWORD: ${TASK_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Task-completion emails (off unless MAIL_ENABLED=true in deploy/.env)
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-TaskFlow <no-reply@taskflow.local>}
      APP_URL: ${APP_URL:-http://localhost}
    restart: unless-stopped

  # Single entry point on port 80: routes /api/auth -> auth, /api/tasks -> tasks.
  # CloudFront sends all /api/* traffic here.
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - task-service
    restart: unless-stopped
